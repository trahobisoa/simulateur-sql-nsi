<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/mermaid@9.4.3/dist/mermaid.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; padding: 0; overflow: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .table-row-hover:hover { background-color: #f1f5f9; }

        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .animate-pulse-soft { animation: pulse-soft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const DATABASES = {

                    INSERT INTO livre VALUES ('978-2081358881', 'Mrs Dalloway', 'Folio', 1925, 1), ('978-2207249123', 'Fondation et Empire', 'Denoël', 1952, 2), ('978-2824709420', 'Le Journal d''un fou', 'Livre de Poche', 1918, 3), ('978-2352879183', 'Guerre et Paix', 'Livre de Poche', 1869, 4), ('978-0000000001', 'Les Voyages de Gulliver', 'Folio', 1726, 5), ('978-0000000002', 'Gargantua et Pantagruel', 'Folio', 1532, 6), ('978-0000000003', 'Asterix le Gaulois', 'Dargaud', 1961, 7), ('978-0000000004', 'Asterix et Cleopatre', 'Dargaud', 1965, 7), ('978-0000000005', 'Le Domaine des dieux (Asterix)', 'Dargaud', 1971, 7);

                `,

                    { text: "Trouver les titres des livres parus entre 1960 et 1980 chez l'éditeur Dargaud.", solution: "SELECT titre FROM livre\nWHERE annee >= 1960 AND annee <= 1980\nAND editeur = 'Dargaud';" },
                    { text: "Chercher les titres et années des livres contenant le mot 'Asterix', triés de façon décroissante par année.", solution: "SELECT titre, annee FROM livre\nWHERE titre LIKE '%Asterix%'\nORDER BY annee DESC;" },
                    { text: "Afficher le titre des livres, le code barre de l'emprunteur et la date de retour (Jointure 2 tables).", solution: "SELECT livre.titre, emprunt.code_barre, emprunt.retour\nFROM emprunt\nJOIN livre ON emprunt.isbn = livre.isbn;" },
                    { text: "Afficher le nom et prénom de l'usager, le titre du livre emprunté et la date de retour (Jointure 3 tables).", solution: "SELECT u.nom, u.prenom, l.titre, e.retour\nFROM emprunt AS e\nJOIN livre AS l ON e.isbn = l.isbn\nJOIN usager AS u ON e.code_barre = u.code_barre;" }

            cinema: {

                `,
                questions: [
                    { text: "Afficher dix noms de personnes (réalisateurs ou acteurs).", solution: "SELECT nom FROM personne LIMIT 10;" },
                    { text: "Lister les titres des films sortis entre 2002 et 2004.", solution: "SELECT titre FROM film\nWHERE annee BETWEEN 2002 AND 2004;" },
                    { text: "La liste des noms et dates de naissance des personnes de nationalité française dont le prénom finit par 'Romain', par ordre alphabétique.", solution: "SELECT nom, naissance FROM personne\nWHERE pays = 'France' AND nom LIKE '% Romain'\nORDER BY nom ASC;" },
                    { text: "La liste alphabétique des acteurs du film 'Le convoyeur' (Jointure).", solution: "SELECT p.nom FROM personne p\nJOIN joue j ON p.id = j.idActeur\nJOIN film f ON j.idFilm = f.id\nWHERE f.titre = 'Le convoyeur'\nORDER BY p.nom;" },
                    { text: "Calculer la moyenne du nombre de spectateurs par film.", solution: "SELECT AVG(nbSpectateurs) FROM film;" }

            football: {
                name: "Football",
                icon: "fa-futbol",
                description: "Championnat de France de football. Gestion des équipes, joueurs, matchs et événements (buts, cartons...).",
                diagram: `erDiagram
        Match ||--o{ Event : "match"

                sql: `

                questions: [
                    { text: "Combien d'équipes ont participé à ce championnat ?", solution: "SELECT COUNT(*) FROM Team;" },
                    { text: "Lister les noms des clubs ainsi que leur date de création dans l'ordre chronologique.", solution: "SELECT name, birthday FROM Team ORDER BY birthday ASC;" },
                    { text: "Combien de pénaltys (type 'penalty') ont été marqués ?", solution: "SELECT COUNT(*) FROM Event WHERE type = 'penalty';" },
                    { text: "Combien de pénaltys ont été sifflés (marqués 'penalty' ou ratés 'miss') ?", solution: "SELECT COUNT(*) FROM Event WHERE type = 'penalty' OR type = 'miss';" },

                    { text: "Afficher tous les renseignements sur les 10 cartons rouges ('red') obtenus le plus rapidement.", solution: "SELECT * FROM Event WHERE type = 'red' ORDER BY time ASC LIMIT 10;" },
                    { text: "Donner le nom du joueur qui a obtenu le carton rouge le plus rapidement.", solution: "SELECT p.name FROM Player p\nJOIN Event e ON p.id = e.player\nWHERE e.type = 'red'\nORDER BY e.time ASC\nLIMIT 1;" }

            tour_de_france: {

                description: "Données sportives : équipes, coureurs, étapes et temps réalisés.",
                diagram: `erDiagram
        equipe ||--o{ coureur : "codeEquipe"
        coureur ||--o{ temps : "dossard"
        etape ||--o{ temps : "numeroEtape"

                sql: `

                    INSERT INTO equipe VALUES ('ALM', 'AG2R La Mondiale'), ('AST', 'Astana Pro Team'), ('COF', 'Cofidis'), ('DQT', 'Deceuninck Quick Step'), ('TJV', 'Team Jumbo-Visma');
                    INSERT INTO coureur VALUES (141, 'LÓPEZ', 'Miguel Ángel', 'AST'), (142, 'FRAILE', 'Omar', 'AST'), (11, 'ROGLIČ', 'Primož', 'TJV'), (41, 'ALAPHILIPPE', 'Julian', 'DQT'), (121, 'MARTIN', 'Guillaume', 'COF'), (122, 'CONSONNI', 'Simone', 'COF');
                    INSERT INTO etape VALUES (1, 'Nice', 'Nice', 156), (2, 'Nice', 'Nice', 185), (3, 'Nice', 'Sisteron', 198), (4, 'Sisteron', 'Orcières-Merlette', 160), (5, 'Gap', 'Privas', 198);
                    INSERT INTO temps VALUES (41, 2, '04:55:27'), (121, 4, '04:07:47'), (11, 5, '04:21:22'), (122, 5, '04:21:22');
                `,
                questions: [
                    { text: "Afficher la liste complète des étapes (numéro, villes de départ et d'arrivée, kilomètres).", solution: "SELECT numeroEtape, villeDepart, villeArrivee, km FROM etape;" },
                    { text: "Lister les noms des équipes et les noms/prénoms de leurs coureurs associés, par ordre alphabétique des équipes.", solution: "SELECT e.nomEquipe, c.nomCoureur, c.prenomCoureur\nFROM equipe e\nJOIN coureur c ON e.codeEquipe = c.codeEquipe\nORDER BY e.nomEquipe;" },
                    { text: "Quel temps a réalisé Guillaume MARTIN sur l'étape 4 ?", solution: "SELECT c.nomCoureur, t.tempsRealise\nFROM temps t\nJOIN coureur c ON t.dossard = c.dossard\nWHERE c.nomCoureur = 'MARTIN' AND t.numeroEtape = 4;" },
                    { text: "Quels sont les temps réalisés sur l'étape 5 (Privas) ?", solution: "SELECT c.nomCoureur, t.tempsRealise\nFROM temps t\nJOIN coureur c ON t.dossard = c.dossard\nWHERE t.numeroEtape = 5;" },
                    { text: "Calculer la distance totale de ce tour cycliste.", solution: "SELECT SUM(km) FROM etape;" }

            location_voitures: {
                name: "Location Auto",
                icon: "fa-car",
                description: "Gestion d'un réseau d'agences de location et de sa flotte de véhicules.",
                diagram: `erDiagram
        agence ||--o{ voiture : "id_agence"
        
        agence {
            INT id_agence PK
            VARCHAR ville
            VARCHAR departement
        }
        voiture {
            INT id_voiture PK
            VARCHAR marque
            VARCHAR modele
            INT kilometrage
            VARCHAR couleur
            INT id_agence FK
        }`,
                sql: `
                    CREATE TABLE agence (id_agence INT PRIMARY KEY, ville VARCHAR(100), departement VARCHAR(5));
                    CREATE TABLE voiture (id_voiture INT PRIMARY KEY, marque VARCHAR(50), modele VARCHAR(50), kilometrage INT, couleur VARCHAR(30), id_agence INT);

                    INSERT INTO agence VALUES (1, 'Paris', '75'), (2, 'Lyon', '69'), (3, 'Marseille', '13'), (4, 'Aubagne', '13');
                    INSERT INTO voiture VALUES (1, 'Renault', 'Clio', 12000, 'Rouge', 2), (2, 'Peugeot', '205', 22000, 'Noir', 3), (3, 'Toyota', 'Yaris', 33000, 'Noir', 3), (4, 'Peugeot', '308', 5000, 'Blanc', 1);
                `,
                questions: [
                    { text: "Visualiser toute la relation Agences.", solution: "SELECT * FROM agence;" },
                    { text: "Lister les villes des agences situées dans le département '13'.", solution: "SELECT ville, departement FROM agence\nWHERE departement = '13';" },
                    { text: "Déterminer le kilométrage maximum parmi tous les véhicules.", solution: "SELECT MAX(kilometrage) FROM voiture;" },
                    { text: "Afficher les marques et modèles des véhicules ainsi que la ville de leur agence (Jointure).", solution: "SELECT v.marque, v.modele, a.ville\nFROM voiture v\nJOIN agence a ON v.id_agence = a.id_agence;" }
                ]
            }
        };

        const Mermaid = ({ chart }) => {
            const ref = React.useRef(null);
            React.useEffect(() => {
                if (ref.current) {
                    ref.current.removeAttribute('data-processed');
                    ref.current.innerHTML = chart;
                    if (window.mermaid) {
                        window.mermaid.initialize({ startOnLoad: false, theme: 'default', fontFamily: 'Inter' });
                        window.mermaid.init(undefined, ref.current);
                    }
                }
            }, [chart]);
            return <div className="mermaid flex justify-center text-sm py-4" ref={ref}></div>;
        };

        const App = () => {
            const [sqlJs, setSqlJs] = React.useState(null);
            const [db, setDb] = React.useState(null);
            const [activeDbKey, setActiveDbKey] = React.useState('bibliotheque');
            const [currentQuestionIndex, setCurrentQuestionIndex] = React.useState(0);
            const [query, setQuery] = React.useState("");
            const [results, setResults] = React.useState([]);
            const [error, setError] = React.useState(null);
            const [schema, setSchema] = React.useState([]);
            const [isLoading, setIsLoading] = React.useState(true);
            const [showDiagramModal, setShowDiagramModal] = React.useState(false);
            const [validationStatus, setValidationStatus] = React.useState(null);
            const [aiLoading, setAiLoading] = React.useState(false);
            const [aiResponse, setAiResponse] = React.useState("");
            const [showAiModal, setShowAiModal] = React.useState(false);
            const [aiTitle, setAiTitle] = React.useState("");
            
            // État pour stocker la progression : { bibliotheque: [0, 2], cinema: [1], ... }
            const [completedQuestions, setCompletedQuestions] = React.useState(() => {
                const initialStatus = {};
                Object.keys(DATABASES).forEach(key => { initialStatus[key] = []; });
                return initialStatus;
            });

            React.useEffect(() => {
                initSqlJs({ locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}` })
                    .then(SQL => {
                        setSqlJs(SQL);
                        setIsLoading(false);
                    })
                    .catch(err => {
                        console.error(err);
                        setError("Erreur critique lors du chargement du moteur SQL local.");
                    });
            }, []);

            React.useEffect(() => {
                if (!sqlJs) return;
                try {
                    const newDb = new sqlJs.Database();
                    newDb.run(DATABASES[activeDbKey].sql);
                    setDb(newDb);
                    
                    updateSchemaState(newDb);
                    
                    // Reset UI pour la nouvelle BD
                    setCurrentQuestionIndex(0);
                    setQuery("");
                    setResults([]);
                    setError(null);
                    setValidationStatus(null);
                    
                } catch (err) {
                    setError("Erreur lors de la construction de la base : " + err.message);
                }
            }, [sqlJs, activeDbKey]);

            const updateSchemaState = (database) => {
                const schemaResult = database.exec(`
                    SELECT m.name as tableName, p.name as columnName, p.type as columnType
                    FROM sqlite_master m
                    LEFT OUTER JOIN pragma_table_info((m.name)) p
                    WHERE m.type = 'table' AND m.name NOT LIKE 'sqlite_%'
                    ORDER BY tableName, p.cid
                `);

                if (schemaResult.length > 0) {
                    const parsedSchema = {};
                    schemaResult[0].values.forEach(row => {
                        const [table, col, type] = row;
                        if (!parsedSchema[table]) parsedSchema[table] = [];
                        parsedSchema[table].push({ name: col, type: type });
                    });
                    setSchema(Object.entries(parsedSchema).map(([table, cols]) => ({ table, cols })));
                } else {
                    setSchema([]);
                }
            };

            const executeQuery = () => {
                if (!db || !query.trim()) return;
                
                setError(null);
                setValidationStatus(null);
                
                try {
                    const res = db.exec(query);
                    setResults(res);
                    
                    // Auto-correction de la requête
                    const expectedQuery = DATABASES[activeDbKey].questions[currentQuestionIndex].solution;
                    if (expectedQuery) {
                        try {
                            const expRes = db.exec(expectedQuery);
                            let isMatch = false;
                            
                            if (res.length === 0 && expRes.length === 0) {
                                isMatch = true;
                            } else if (res.length > 0 && expRes.length > 0) {
                                const userVals = JSON.stringify(res[0].values);
                                const expVals = JSON.stringify(expRes[0].values);
                                isMatch = (userVals === expVals);
                            }
                            
                            if (isMatch) {
                                setValidationStatus('success');
                                // Mettre à jour la progression
                                setCompletedQuestions(prev => {
                                    const currentCompleted = prev[activeDbKey];
                                    if (!currentCompleted.includes(currentQuestionIndex)) {
                                        return { ...prev, [activeDbKey]: [...currentCompleted, currentQuestionIndex] };
                                    }
                                    return prev;
                                });
                            } else {
                                setValidationStatus('error');
                            }
                        } catch (e) {
                            console.error("Erreur de validation interne:", e);
                        }
                    }
                    
                    const upperQuery = query.toUpperCase();
                    if (upperQuery.includes('CREATE TABLE') || upperQuery.includes('DROP TABLE') || upperQuery.includes('ALTER TABLE')) {
                         updateSchemaState(db);
                    }

                } catch (err) {
                    setError(err.message);
                    setResults([]);
                    setValidationStatus('error');
                }
            };

            const selectQuestion = (idx) => {
                setCurrentQuestionIndex(idx);
                setQuery("");
                setResults([]);
                setError(null);
                setValidationStatus(null);
            };

            const handleKeyDown = (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    executeQuery();
                }
            };

            const askGemini = async (promptType) => {
                setAiLoading(true);
                setAiResponse("");
                setShowAiModal(true);
                
                let prompt = "";
                let title = "";
                const currentQuestion = DATABASES[activeDbKey].questions[currentQuestionIndex];
                
                // Formater le schéma pour donner du contexte à l'IA
                const schemaStr = schema.map(t => `${t.table}(${t.cols.map(c=>c.name).join(', ')})`).join('; ');

                if (promptType === 'hint') {
                    title = "Indice de l'Assistant IA";
                    prompt = `Tu es un professeur de spécialité NSI. L'élève bloque sur cette question SQL : "${currentQuestion.text}". 
                    Le schéma de la base de données est : ${schemaStr}. 
                    Donne-lui un indice concis et pédagogique pour l'aider à démarrer, sans lui donner la solution complète. N'écris pas de requête SQL finale, guide seulement sa réflexion. Formate ta réponse en texte simple et agréable à lire.`;
                } else if (promptType === 'error') {
                    title = "Explication de l'Erreur SQL";
                    prompt = `Tu es un professeur de spécialité NSI. L'élève a écrit cette requête : "${query}". 
                    Le moteur SQLite a renvoyé cette erreur : "${error}". 
                    Le schéma de la base est : ${schemaStr}.
                    Explique-lui simplement la cause de l'erreur et donne-lui un conseil sur la façon de la corriger, de manière bienveillante et encourageante.`;
                } else if (promptType === 'explain') {
                    title = "Explication de la Requête";
                    prompt = `Tu es un professeur de spécialité NSI. L'élève a exécuté cette requête SQL avec succès : "${query}".
                    Explique-lui simplement et étape par étape ce que fait cette requête pour qu'il comprenne bien la logique relationnelle.`;
                }
                
                setAiTitle(title);

                try {
                    const apiKey = ""; // L'API Key sera injectée automatiquement par Canvas
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                    const payload = {
                        contents: [{ parts: [{ text: prompt }] }]
                    };
                    
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    const result = await response.json();
                    if (result.candidates && result.candidates.length > 0) {
                        setAiResponse(result.candidates[0].content.parts[0].text);
                    } else {
                        setAiResponse("Désolé, je n'ai pas pu générer de réponse.");
                    }
                } catch (err) {
                    setAiResponse("Erreur de connexion à l'assistant IA. " + err.message);
                }
                setAiLoading(false);
            };

            if (isLoading) {
                return (
                    <div className="flex h-screen items-center justify-center bg-slate-50">
                        <div className="text-center">
                            <i className="fas fa-database fa-spin text-4xl text-blue-600 mb-4"></i>
                            <h2 className="text-xl font-semibold text-slate-700 animate-pulse-soft">Initialisation du moteur SQL en local...</h2>
                        </div>
                    </div>
                );
            }

            // Calcul du pourcentage pour la base active
            const currentDbQuestionsCount = DATABASES[activeDbKey].questions.length;
            const currentDbCompletedCount = completedQuestions[activeDbKey].length;
            const progressPercentage = Math.round((currentDbCompletedCount / currentDbQuestionsCount) * 100) || 0;

            return (
                <div className="flex flex-col h-screen bg-slate-100 overflow-hidden font-sans">
                    {/* EN-TÊTE PRINCIPAL */}
                    <header className="bg-slate-900 text-white shadow-md z-10 px-6 py-4 flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <i className="fas fa-terminal text-blue-400 text-xl"></i>
                            <h1 className="text-xl font-bold tracking-tight">Simulateur SQL <span className="text-blue-400 font-normal ml-2 text-lg">| Spécialité NSI</span></h1>
                        </div>
                        <div className="flex bg-slate-800 rounded-lg p-1 space-x-1 overflow-x-auto">
                            {Object.entries(DATABASES).map(([key, data]) => {
                                const isFullyCompleted = completedQuestions[key].length === data.questions.length;
                                return (
                                    <button 
                                        key={key}
                                        onClick={() => setActiveDbKey(key)}
                                        className={`relative px-4 py-2 rounded-md text-sm font-medium transition-all duration-200 whitespace-nowrap ${activeDbKey === key ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-300 hover:text-white hover:bg-slate-700'}`}
                                    >
                                        <i className={`fas ${data.icon} mr-2 w-4 text-center`}></i>
                                        {data.name}
                                        {isFullyCompleted && <i className="fas fa-star text-amber-400 absolute -top-1 -right-1 text-[10px]"></i>}
                                    </button>
                                );
                            })}
                        </div>
                    </header>

                    <div className="flex flex-1 overflow-hidden">
                        
                        {/* PANNEAU LATÉRAL : Schéma */}
                        <aside className="w-[20rem] bg-white border-r border-slate-200 flex flex-col shadow-sm z-0 relative flex-shrink-0">
                            
                            {/* Infos Base Active */}
                            <div className="p-4 border-b border-slate-100 bg-slate-50 flex-shrink-0">
                                <h3 className="font-semibold text-slate-800 mb-2 flex items-center gap-2">
                                    <i className="fas fa-database text-blue-500"></i>
                                    {DATABASES[activeDbKey].name}
                                </h3>
                                <p className="text-xs text-slate-500 mb-4 leading-relaxed">{DATABASES[activeDbKey].description}</p>
                                <button
                                    onClick={() => setShowDiagramModal(true)}
                                    className="w-full bg-indigo-50 text-indigo-700 hover:bg-indigo-100 border border-indigo-200 py-2 px-3 rounded-md text-sm font-semibold transition-colors flex items-center justify-center gap-2 shadow-sm"
                                >
                                    <i className="fas fa-project-diagram"></i> Afficher le diagramme
                                </button>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto custom-scrollbar p-4 flex flex-col gap-6">
                                {/* Détail des Tables */}
                                <div>
                                    <h4 className="text-xs uppercase tracking-wider font-bold text-slate-400 mb-3 flex items-center gap-2">
                                        <i className="fas fa-table"></i> Structure des Tables
                                    </h4>
                                    {schema.length === 0 ? (
                                        <p className="text-sm text-slate-500 italic bg-slate-50 p-3 rounded border border-slate-100">Aucune table détectée.</p>
                                    ) : (
                                        <div className="space-y-3">
                                            {schema.map((t, i) => (
                                                <div key={i} className="border border-slate-200 rounded-md overflow-hidden bg-white shadow-sm">
                                                    <div className="bg-slate-100 px-3 py-2 border-b border-slate-200 flex items-center justify-between">
                                                        <span className="font-mono text-sm font-bold text-slate-800">{t.table}</span>
                                                        <span className="text-xs text-slate-400 bg-white px-1.5 py-0.5 rounded border border-slate-200">{t.cols.length} cols</span>
                                                    </div>
                                                    <div className="px-3 py-2 space-y-1.5">
                                                        {t.cols.map((c, j) => (
                                                            <div key={j} className="flex justify-between items-center text-xs font-mono">
                                                                <span className="text-blue-700">{c.name}</span>
                                                                <span className="text-slate-500 text-[10px] uppercase tracking-wider">{c.type || 'TEXT'}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </aside>

                        {/* WORKSPACE : Questions, Éditeur, Résultats */}
                        <main className="flex-1 flex flex-col bg-slate-50 relative min-w-0 overflow-y-auto custom-scrollbar">
                            
                            {/* ZONE DES QUESTIONS (Tableau au-dessus de l'éditeur) */}
                            <div className="border-b border-slate-200 bg-white flex flex-col flex-shrink-0 shadow-sm z-10">
                                <div className="bg-slate-100 px-4 py-2 border-b border-slate-200 flex justify-between items-center sticky top-0">
                                    <div className="font-bold text-sm text-slate-700 flex items-center gap-2">
                                        <i className="fas fa-tasks text-blue-500"></i> Exercices à réaliser
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <span className="text-xs font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full">
                                            Progression : {progressPercentage}%
                                        </span>
                                        <div className="w-24 bg-slate-200 rounded-full h-1.5 overflow-hidden">
                                            <div className="bg-emerald-500 h-1.5 rounded-full transition-all duration-500 ease-out" style={{width: `${progressPercentage}%`}}></div>
                                        </div>
                                    </div>
                                </div>
                                <div className="overflow-y-auto custom-scrollbar flex-1 p-2 space-y-1">
                                    {DATABASES[activeDbKey].questions.map((q, idx) => {
                                        const isCompleted = completedQuestions[activeDbKey].includes(idx);
                                        const isActive = currentQuestionIndex === idx;
                                        return (
                                            <div 
                                                key={idx}
                                                onClick={() => selectQuestion(idx)}
                                                className={`flex items-start gap-3 p-3 rounded-lg cursor-pointer transition-colors border ${isActive ? 'bg-blue-50 border-blue-200 shadow-sm' : 'bg-white border-transparent hover:bg-slate-50'}`}
                                            >
                                                <div className="mt-0.5">
                                                    {isCompleted ? (
                                                        <i className="fas fa-check-circle text-emerald-500 text-lg"></i>
                                                    ) : (
                                                        <i className={`far ${isActive ? 'fa-dot-circle text-blue-600' : 'fa-circle text-slate-300'} text-lg`}></i>
                                                    )}
                                                </div>
                                                <div className="flex-1">
                                                    <span className={`text-sm leading-relaxed ${isActive ? 'font-semibold text-blue-900' : 'text-slate-700'}`}>
                                                        <span className="font-bold mr-2 text-slate-500">Q{idx + 1}.</span>
                                                        {q.text}
                                                    </span>
                                                </div>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>

                            {/* ZONE ÉDITEUR SQL */}
                            <div className="flex flex-col border-b border-slate-200 bg-white" style={{ minHeight: '180px', flex: '1 1 35%' }}>
                                <div className="flex justify-between items-center px-4 py-2 border-b border-slate-100 bg-slate-50">
                                    <div className="flex items-center gap-2 text-sm font-bold text-slate-700">
                                        <i className="fas fa-terminal text-slate-400"></i> Éditeur SQL
                                        <span className="ml-2 text-xs font-normal text-blue-600 bg-blue-50 px-2 py-0.5 rounded border border-blue-100">
                                            Cible : Question {currentQuestionIndex + 1}
                                        </span>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <span className="text-xs text-slate-400 hidden sm:inline-block">Ctrl + Entrée pour exécuter</span>
                                        <button 
                                            onClick={() => {
                                                setQuery(DATABASES[activeDbKey].questions[currentQuestionIndex].solution);
                                                setValidationStatus(null);
                                            }}
                                            className="bg-amber-500 hover:bg-amber-600 text-white px-4 py-1.5 rounded-md text-sm font-medium flex items-center gap-2 transition-colors shadow-sm"
                                            title="Remplacer par la solution"
                                        >
                                            <i className="fas fa-lightbulb text-xs"></i> Solution
                                        </button>
                                        <button 
                                            onClick={executeQuery}
                                            className="bg-green-600 hover:bg-green-700 text-white px-4 py-1.5 rounded-md text-sm font-medium flex items-center gap-2 transition-colors shadow-sm"
                                        >
                                            <i className="fas fa-play text-xs"></i> Exécuter
                                        </button>
                                    </div>
                                </div>
                                <div className="flex-1 relative bg-[#1e1e1e]">
                                    <textarea 
                                        value={query}
                                        onChange={(e) => {
                                            setQuery(e.target.value);
                                            setValidationStatus(null);
                                        }}
                                        onKeyDown={handleKeyDown}
                                        className="w-full h-full p-4 font-mono text-[15px] leading-relaxed bg-transparent text-[#d4d4d4] resize-none focus:outline-none custom-scrollbar"
                                        spellCheck="false"
                                        placeholder="Écrivez votre requête SQL ici..."
                                    />
                                </div>
                            </div>

                            {/* ZONE RÉSULTATS */}
                            <div className="flex flex-col bg-slate-50 flex-1 overflow-hidden" style={{ minHeight: '200px', flex: '1 1 65%' }}>
                                <div className="px-4 py-2 border-b border-slate-200 bg-white flex items-center justify-between">
                                    <div className="flex items-center gap-2 text-sm font-bold text-slate-700">
                                        <i className="fas fa-list text-blue-500"></i> Résultats
                                    </div>
                                </div>
                                <div className="flex-1 overflow-auto custom-scrollbar p-6 relative">
                                    
                                    {/* Feedback Succès */}
                                    {validationStatus === 'success' && (
                                        <div className="bg-emerald-50 border border-emerald-200 text-emerald-800 px-4 py-3 rounded-lg mb-5 flex justify-between items-center fade-in shadow-sm">
                                            <div className="flex items-center gap-3">
                                                <i className="fas fa-check-circle text-2xl text-emerald-500"></i>
                                                <div>
                                                    <h4 className="font-bold text-sm">Bonne réponse !</h4>
                                                    <p className="text-xs text-emerald-600 mt-0.5">La question a été ajoutée à votre progression.</p>
                                                </div>
                                            </div>
                                            <button 
                                                onClick={() => askGemini('explain')}
                                                className="bg-emerald-100 hover:bg-emerald-200 text-emerald-800 border border-emerald-200 px-3 py-1.5 rounded text-xs font-bold transition-colors ml-4 flex-shrink-0"
                                            >
                                                <i className="fas fa-robot mr-1"></i> Expliquer
                                            </button>
                                        </div>
                                    )}

                                    {/* Feedback Échec */}
                                    {validationStatus === 'error' && !error && (
                                        <div className="bg-rose-50 border border-rose-200 text-rose-800 px-4 py-3 rounded-lg mb-5 flex items-center gap-3 fade-in shadow-sm">
                                            <i className="fas fa-times-circle text-2xl text-rose-500"></i>
                                            <div>
                                                <h4 className="font-bold text-sm">Résultat inattendu</h4>
                                                <p className="text-xs text-rose-600 mt-0.5">Les données ne correspondent pas à la solution. Essayez encore !</p>
                                            </div>
                                        </div>
                                    )}

                                    {/* Feedback Erreur SQL */}
                                    {error && (
                                        <div className="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 rounded shadow-sm mb-4">
                                            <div className="flex items-start justify-between">
                                                <div className="flex items-start">
                                                    <i className="fas fa-exclamation-triangle mt-0.5 mr-3 text-red-500"></i>
                                                    <div>
                                                        <h3 className="font-bold text-sm">Erreur de syntaxe SQL</h3>
                                                        <p className="text-sm font-mono mt-1.5 whitespace-pre-wrap">{error}</p>
                                                    </div>
                                                </div>
                                                <button 
                                                    onClick={() => askGemini('error')}
                                                    className="bg-red-100 hover:bg-red-200 text-red-800 border border-red-200 px-3 py-1.5 rounded text-xs font-bold transition-colors ml-4 flex-shrink-0"
                                                >
                                                    <i className="fas fa-robot mr-1"></i> Expliquer l'erreur
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    {/* État vide */}
                                    {!error && results.length === 0 && validationStatus === null && (
                                        <div className="h-full flex flex-col items-center justify-center text-slate-400">
                                            <div className="bg-white p-5 rounded-full shadow-sm mb-3 border border-slate-100">
                                                <i className="fas fa-terminal text-2xl text-slate-300"></i>
                                            </div>
                                            <p className="text-sm font-medium">Prêt à exécuter.</p>
                                        </div>
                                    )}

                                    {/* Tableaux de résultats */}
                                    {!error && results.length > 0 && results.map((resultset, i) => (
                                        <div key={i} className="mb-6 last:mb-0 inline-block min-w-full fade-in">
                                            <div className="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
                                                <table className="min-w-full border-collapse">
                                                    <thead className="bg-slate-50 border-b border-slate-200">
                                                        <tr>
                                                            {resultset.columns.map((col, j) => (
                                                                <th key={j} className="px-4 py-3 text-left text-xs font-bold text-slate-600 uppercase tracking-wider font-mono border-r border-slate-200 last:border-r-0">
                                                                    {col}
                                                                </th>
                                                            ))}
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-100">
                                                        {resultset.values.map((row, rowIndex) => (
                                                            <tr key={rowIndex} className="table-row-hover transition-colors">
                                                                {row.map((val, colIndex) => (
                                                                    <td key={colIndex} className="px-4 py-2.5 text-sm text-slate-700 whitespace-nowrap border-r border-slate-100 last:border-r-0">
                                                                        {val === null ? <span className="text-slate-400 italic text-xs">NULL</span> : val}
                                                                    </td>
                                                                ))}
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                            <div className="mt-2.5 text-xs font-medium text-slate-500 flex items-center gap-1.5">
                                                <i className="fas fa-info-circle text-blue-400"></i>
                                                {resultset.values.length} ligne(s) retournée(s).
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </main>
                    </div>

                    {/* PIED DE PAGE */}
                    <footer className="bg-slate-900 text-slate-400 text-xs py-2.5 text-center border-t border-slate-800 z-10 flex-shrink-0 tracking-wide">
                        Créé par Tantely RAHOBISOA — Spécialité NSI Terminale | IFS Singapore
                    </footer>

                    {/* MODALE DIAGRAMME RELATIONNEL */}
                    {showDiagramModal && (
                        <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center backdrop-blur-sm p-6">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-5xl max-h-[90vh] flex flex-col overflow-hidden fade-in">
                                <div className="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                                    <h2 className="text-xl font-bold text-slate-800 flex items-center gap-3">
                                        <i className="fas fa-project-diagram text-indigo-500"></i>
                                        Diagramme Relationnel : {DATABASES[activeDbKey].name}
                                    </h2>
                                    <button 
                                        onClick={() => setShowDiagramModal(false)} 
                                        className="text-slate-400 hover:text-slate-700 hover:bg-slate-200 p-2 rounded-full transition-colors focus:outline-none"
                                    >
                                        <i className="fas fa-times text-xl"></i>
                                    </button>
                                </div>
                                <div className="p-8 overflow-auto bg-white flex-1 custom-scrollbar">
                                    <div className="border border-slate-100 rounded-lg p-4 bg-slate-50">
                                        <Mermaid chart={DATABASES[activeDbKey].diagram} />
                                    </div>
                                </div>
                                <div className="px-6 py-4 border-t border-slate-200 bg-slate-50 text-right">
                                    <button 
                                        onClick={() => setShowDiagramModal(false)} 
                                        className="bg-slate-800 text-white px-5 py-2.5 rounded-md shadow-sm hover:bg-slate-700 transition-colors text-sm font-semibold"
                                    >
                                        Fermer le diagramme
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODALE ASSISTANT IA */}
                    {showAiModal && (
                        <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center backdrop-blur-sm p-6">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl flex flex-col overflow-hidden fade-in">
                                <div className="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-purple-50">
                                    <h2 className="text-lg font-bold text-purple-800 flex items-center gap-3">
                                        <i className="fas fa-robot text-purple-600"></i>
                                        {aiTitle}
                                    </h2>
                                    <button 
                                        onClick={() => setShowAiModal(false)} 
                                        className="text-purple-400 hover:text-purple-700 hover:bg-purple-100 p-2 rounded-full transition-colors focus:outline-none"
                                    >
                                        <i className="fas fa-times text-xl"></i>
                                    </button>
                                </div>
                                <div className="p-8 overflow-auto bg-white flex-1 max-h-[70vh] custom-scrollbar text-slate-700 text-sm leading-relaxed whitespace-pre-wrap">
                                    {aiLoading ? (
                                        <div className="flex flex-col items-center justify-center py-10">
                                            <i className="fas fa-circle-notch fa-spin text-4xl text-purple-500 mb-4"></i>
                                            <p className="text-purple-700 font-medium animate-pulse">L'IA réfléchit...</p>
                                        </div>
                                    ) : (
                                        aiResponse
                                    )}
                                </div>
                                <div className="px-6 py-4 border-t border-slate-200 bg-slate-50 text-right">
                                    <button 
                                        onClick={() => setShowAiModal(false)} 
                                        className="bg-slate-800 text-white px-5 py-2.5 rounded-md shadow-sm hover:bg-slate-700 transition-colors text-sm font-semibold"
                                    >
                                        Fermer l'assistant
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
